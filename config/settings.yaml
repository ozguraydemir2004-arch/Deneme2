# ===========================================================================
# Ajans Sistemi Konfigurasyonu
# Tum alanlar ortam degiskenleri ile override edilebilir (bkz. agency/config.py)
# ===========================================================================

exchange:
  id: binance
  symbol: BTC/USDT
  timeframe: 1h
  # Tek seferde cekilecek mum sayisi (CCXT limiti)
  limit: 2160
  # Emir defteri snapshot'i (order book imbalance) arastirmasinda kullanilir
  order_book_depth: 50
  request_timeout_ms: 25000
  enable_rate_limit: true

data:
  # auto -> CCXT dene, basarisizsa sentetik veriye dus
  # ccxt | synthetic
  provider: auto
  cache_dir: runtime/cache
  cache_ttl_minutes: 15
  # Birincil borsa (exchange.id) engelliyse sirayla denenecek CCXT borsalari
  fallback_exchanges: [kraken, coinbase]
  # CCXT tamamen basarisizsa gercek veriyi REST ile cekmeyi dene (CoinGecko, anahtarsiz)
  rest_fallback_enabled: true
  # Sentetik veri (cevrimdisi dogrulama / demo) parametreleri
  synthetic_bars: 2880
  synthetic_seed: 1337
  synthetic_start_price: 42000.0
  synthetic_annual_vol: 0.55
  synthetic_drift: 0.18

backtest:
  initial_capital: 10000.0
  fee_bps: 7.5           # tek yon komisyon (Binance spot taker ~0.075%)
  slippage_bps: 2.0
  # Long-only spot simulasyonu; kaldirac 1.0
  allow_short: false
  min_trades: 8
  risk_per_trade_pct: 1.5
  # Sandbox calistirma limitleri
  run_timeout_seconds: 120
  max_memory_mb: 1536
  train_split: 0.7       # veri %70 train / %30 out-of-sample

targets:
  min_net_profit_pct: 2.0
  min_win_rate: 40.0
  max_drawdown_pct: 20.0
  min_sharpe: 0.25
  min_profit_factor: 1.10
  min_score: 50.0
  # Bir dongude kac kez yeniden kodlama (rework) denenecek
  max_rework_attempts: 3
  # 0 = sonsuz (24/7), aksi halde bu kadar dongu sonrasi durur
  max_cycles_per_run: 0
  cycle_sleep_seconds: 60
  # Arastirma ajani kac aday strateji uretecek
  candidates_per_cycle: 3

memory:
  database: runtime/agency.db
  # Vektor hafiza boyutu (hash-tabanli TF-IDF uzayi)
  vector_dim: 256
  top_k_snapshots: 6
  top_k_strategies: 5
  # Kazanc esigi: su kadar ileri getiri saglayan anlar "basari snapshot" sayilir
  winner_forward_return_pct: 1.5
  winner_horizon_bars: 12
  max_snapshots_per_cycle: 400

research:
  # Web taramasi (kripto haberleri) icin genel API; ag yoksa bilgi tabanina duser
  news_enabled: true
  news_endpoint: https://min-api.cryptocompare.com/data/v2/news/?lang=EN
  news_timeout_seconds: 10
  max_news_items: 12
  # Indikatör kombinasyonlarini tararken kullanilacak playbook
  playbook: agency/knowledge/strategy_playbook.json

logging:
  dir: runtime/logs
  level: INFO
  jsonl: true
  # Her ajans adiminda prompt/cevap loglanacak mi (hassas veri icermez)
  log_llm_calls: true

llm:
  provider: auto          # auto | openai | anthropic | offline
  model: gpt-4o-mini
  anthropic_model: claude-3-5-sonnet-latest
  base_url: https://api.openai.com/v1
  temperature: 0.35
  max_tokens: 2200
  timeout_seconds: 90
  max_retries: 2

versioning:
  # Uretilen strateji dosyalari
  library_dir: agency/strategies/library
  archive_dir: runtime/archive
  # Skorlama agirliklari (toplam 1.0)
  score_weights:
    net_profit: 0.35
    win_rate: 0.20
    drawdown: 0.20
    sharpe: 0.15
    profit_factor: 0.10
  # Bu skorun uzerindeki stratejiler "elite" sayilir ve kalici hafizaya alinir
  elite_score: 70.0

runtime:
  state_file: runtime/state.json
  reports_dir: runtime/reports
  # Orkestrasyon backend'i: native | crewai | langgraph
  # native = bagimliliksiz yerlesik akis (her ortamda calisir)
  # langgraph / crewai = ilgili paket kuruluysa graf/crew tabanli akis
  backend: native
  # Islem (trade) maliyeti muhasebesi icin baz para birimi
  quote_currency: USDT
