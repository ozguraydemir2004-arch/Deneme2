# CI Workflow sablonu
#
# Kullanim: bu dosyayi `.github/workflows/ci.yml` olarak kopyalayin.
# (GitHub App tokeninda "workflows" izni yoksa dogrudan commit edilemez;
#  kullanici kendi tokeni ile ekleyebilir.)

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyflakes
      - name: Statik kontrol (pyflakes)
        run: python -m pyflakes agency main.py tests
      - name: Testler
        env:
          AGENCY_DATA_PROVIDER: synthetic
          AGENCY_LLM_PROVIDER: offline
        run: python -m pytest -q
